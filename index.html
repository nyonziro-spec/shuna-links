<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放置のシュナ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #080808;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #e8e8e8;
    --sub: #888;
    --line: #06C755;
    --accent: #b8a9ff;
    --glow: rgba(184,169,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景エフェクト：雨粒 */
  .rain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .drop {
    position: absolute;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(184,169,255,0.3));
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-100px); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.3; }
    100% { transform: translateY(110vh); opacity: 0; }
  }

  /* 波紋 */
  .ripple-container {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%; height: 40%;
    pointer-events: none;
    z-index: 0;
  }
  .ripple {
    position: absolute;
    border: 1px solid rgba(184,169,255,0.1);
    border-radius: 50%;
    animation: ripple-expand linear infinite;
  }
  @keyframes ripple-expand {
    0% { transform: scale(0.3); opacity: 0.8; }
    100% { transform: scale(1); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* キャラクター */
  .char-zone {
    width: 120px;
    height: 120px;
    position: relative;
    margin-bottom: 4px;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .char-circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(184,169,255,0.08);
    border: 1.5px solid rgba(184,169,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 40px rgba(184,169,255,0.1);
  }

  /* シャボン玉 */
  .bubble {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(184,169,255,0.4);
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(184,169,255,0.05));
    animation: bubble-rise ease-in infinite;
  }
  .bubble:nth-child(1) { width: 10px; height: 10px; right: 8px; bottom: 70px; animation-duration: 3.2s; animation-delay: 0s; }
  .bubble:nth-child(2) { width: 7px; height: 7px; right: 20px; bottom: 60px; animation-duration: 2.8s; animation-delay: 0.8s; }
  .bubble:nth-child(3) { width: 5px; height: 5px; right: 5px; bottom: 75px; animation-duration: 3.5s; animation-delay: 1.6s; }

  @keyframes bubble-rise {
    0% { transform: translateY(0); opacity: 0.8; }
    100% { transform: translateY(-60px); opacity: 0; }
  }

  /* 名前 */
  .name {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
    text-align: center;
  }
  .handle {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--sub);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .tagline {
    font-size: 12px;
    color: var(--sub);
    text-align: center;
    line-height: 1.6;
    margin-bottom: 28px;
    padding: 0 20px;
  }

  /* リンクボタン */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.25s ease;
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .link-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .link-btn:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.15);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .link-btn:hover::before { opacity: 1; }
  .link-btn:active { transform: translateY(0); }

  /* LINE */
  .btn-line { }
  .btn-line::before { background: radial-gradient(ellipse at left, rgba(6,199,85,0.08), transparent 70%); }
  .btn-line:hover { border-color: rgba(6,199,85,0.3); box-shadow: 0 8px 32px rgba(6,199,85,0.1); }

  /* MAIL */
  .btn-mail::before { background: radial-gradient(ellipse at left, rgba(184,169,255,0.08), transparent 70%); }
  .btn-mail:hover { border-color: rgba(184,169,255,0.3); box-shadow: 0 8px 32px rgba(184,169,255,0.1); }

  .btn-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .btn-line .btn-icon { background: rgba(6,199,85,0.15); }
  .btn-mail .btn-icon { background: rgba(184,169,255,0.1); }

  .btn-text { flex: 1; }
  .btn-label {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
  }
  .btn-sub {
    font-size: 11px;
    color: var(--sub);
    margin-top: 2px;
    font-family: 'Space Mono', monospace;
  }
  .btn-arrow {
    font-size: 14px;
    color: var(--sub);
    transition: transform 0.2s;
  }
  .link-btn:hover .btn-arrow { transform: translateX(3px); }

  /* フッター */
  .footer {
    margin-top: 32px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.15em;
    text-align: center;
  }

  /* コピートースト */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(184,169,255,0.9);
    color: #000;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- 雨背景 -->
<div class="rain" id="rain"></div>
<div class="ripple-container" id="ripples"></div>

<div class="container">

  <div class="char-zone">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="char-circle">🐾</div>
  </div>

  <div class="name">放置のシュナ</div>
  <div class="handle">@shuna.afk</div>
  <div class="tagline">
    画面を見られると<br>リアル「いいね👍」がもらえちゃう放置動画♪
  </div>

  <div class="links">

    <a class="link-btn btn-line" href="https://line.me/S/sticker/34005767/?lang=ja&utm_source=gnsh_stickerDetail" target="_blank" rel="noopener">
      <div class="btn-icon">💬</div>
      <div class="btn-text">
        <div class="btn-label">LINEスタンプ</div>
        <div class="btn-sub">シュナのスタンプ、発売中</div>
      </div>
      <div class="btn-arrow">→</div>
    </a>

    <a class="link-btn btn-mail" href="mailto:shuna@hachiku89.jp">
      <div class="btn-icon">✉️</div>
      <div class="btn-text">
        <div class="btn-label">お問い合わせ</div>
        <div class="btn-sub">shuna@hachiku89.jp</div>
      </div>
      <div class="btn-arrow">→</div>
    </a>

  </div>

  <div class="footer">SHUNA.AFK &nbsp;·&nbsp; stay calm, stay placed</div>
</div>

<div class="toast" id="toast">メールアドレスをコピーしました</div>

<script>
  // 雨生成
  const rain = document.getElementById('rain');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = Math.random() * 100 + '%';
    d.style.height = (60 + Math.random() * 80) + 'px';
    d.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    d.style.animationDelay = (Math.random() * 3) + 's';
    rain.appendChild(d);
  }

  // 波紋生成
  const rc = document.getElementById('ripples');
  for (let i = 0; i < 6; i++) {
    const r = document.createElement('div');
    r.className = 'ripple';
    const size = 60 + Math.random() * 120;
    r.style.width = size + 'px';
    r.style.height = size * 0.3 + 'px';
    r.style.left = (Math.random() * 100) + '%';
    r.style.bottom = (Math.random() * 80) + 'px';
    r.style.animationDuration = (3 + Math.random() * 4) + 's';
    r.style.animationDelay = (Math.random() * 4) + 's';
    rc.appendChild(r);
  }

  // メールボタンでコピー機能追加
  const mailBtn = document.querySelector('.btn-mail');
  mailBtn.addEventListener('click', function(e) {
    e.preventDefault();
    navigator.clipboard.writeText('shuna@hachiku89.jp').then(() => {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }).catch(() => {
      window.location.href = 'mailto:shuna@hachiku89.jp';
    });
  });
</script>
</body>
</html>
