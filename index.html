<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放置のシュナ</title>
<meta name="description" content="放置のシュナ（@shuna.afk）公式リンク">
<meta property="og:title" content="放置のシュナ">
<meta property="og:description" content="放置のシュナに関する情報をお届けします">
<meta property="og:image" content="shuna.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #f5f0eb;
    --text: #1a1a1a;
    --sub: #666;
    --btn: #e89968;
    --btn-hover: #dc8753;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .char-zone {
    width: 220px;
    height: 220px;
    margin-bottom: 8px;
    animation: float 4s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .char-zone img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .char-zone img.broken { display: none; }
  .char-zone .fallback {
    display: none;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg,#f3d9c4,#e89968);
    align-items: center; justify-content: center;
    font-size: 72px; color: #fff;
  }
  .char-zone img.broken + .fallback { display: flex; }

  .name {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
    text-align: center;
  }
  .handle {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--sub);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .tagline {
    font-size: 13px;
    color: #444;
    text-align: center;
    line-height: 1.7;
    margin-bottom: 28px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--btn);
    border: none;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    transition: all 0.22s ease;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .link-btn:hover {
    transform: translateY(-2px);
    background: var(--btn-hover);
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  .link-btn:active { transform: translateY(0); }

  .btn-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.18);
  }

  .btn-text { flex: 1; }
  .btn-label {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    color: #fff;
  }
  .btn-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    margin-top: 2px;
    font-family: 'Space Mono', monospace;
  }
  .btn-arrow {
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    transition: transform 0.2s;
  }
  .link-btn:hover .btn-arrow { transform: translateX(3px); }

  .footer {
    margin-top: 32px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: rgba(0,0,0,0.25);
    letter-spacing: 0.12em;
    text-align: center;
  }

  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #333;
    color: #fff;
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="container">

  <div class="char-zone">
    <img src="shuna.png?v=4" alt="放置のシュナ"
         onerror="this.classList.add('broken')" />
    <div class="fallback" aria-hidden="true">🧸</div>
  </div>

  <div class="name">放置のシュナ</div>
  <div class="handle">@shuna.afk</div>
  <div class="tagline">放置のシュナに関する情報をお届けします</div>

  <div class="links">

    <a class="link-btn btn-line" href="https://line.me/S/sticker/34005767/?lang=ja&utm_source=gnsh_stickerDetail" target="_blank" rel="noopener">
      <div class="btn-icon">💬</div>
      <div class="btn-text">
        <div class="btn-label">LINEスタンプ</div>
        <div class="btn-sub">シュナのスタンプ、発売中</div>
      </div>
      <div class="btn-arrow">→</div>
    </a>

    <div class="link-btn btn-mail" id="mailBtn">
      <div class="btn-icon">✉️</div>
      <div class="btn-text">
        <div class="btn-label">お問い合わせ</div>
        <div class="btn-sub">コピペしてお送りください</div>
      </div>
      <div class="btn-arrow">→</div>
    </div>

  </div>

  <div class="footer">SHUNA.AFK &nbsp;·&nbsp; stay calm, stay placed</div>
</div>

<div class="toast" id="toast">shuna@hachiku89.jp をコピーしました</div>

<script>
  document.getElementById('mailBtn').addEventListener('click', function() {
    var email = 'shuna@hachiku89.jp';
    function showToast(){
      var toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); }, 2500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).then(showToast, function(){
        window.location.href = 'mailto:' + email;
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = email; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast(); } catch(e) { window.location.href = 'mailto:' + email; }
      document.body.removeChild(ta);
    }
  });
</script>
</body>
</html>
